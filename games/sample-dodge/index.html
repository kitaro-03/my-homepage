<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dodge Sample</title>
<style>
  /* 埋め込み前提なので、ページ全体をゲーム画面にする。広告はここには置かない。 */
  html, body { margin: 0; height: 100%; background: #0a0d12; overflow: hidden;
    font-family: system-ui, sans-serif; color: #e6edf3; touch-action: none; }
  #wrap { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
  canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; touch-action: none; }
  #overlay { position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(10, 13, 18, 0.82); text-align: center; padding: 20px; }
  #overlay[hidden] { display: none; }
  h1 { font-size: 1.3rem; margin: 0 0 8px; }
  p  { margin: 0 0 16px; color: #9aa7b5; font-size: 0.9rem; }
  button { font: inherit; font-weight: 600; padding: 10px 22px; border-radius: 999px;
    border: 0; background: #4f9cf9; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="360"></canvas>
  <div id="overlay">
    <div>
      <h1 id="msg">Dodge Sample</h1>
      <p>落ちてくるブロックをよけよう<br>← → キー / 画面の左右をタップ</p>
      <button id="start">スタート</button>
    </div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');

  const player = { x: W / 2, y: H - 28, w: 26, h: 14, speed: 4.6 };
  let blocks = [], score = 0, best = 0, running = false, spawnTimer = 0, tick = 0;
  const keys = { left: false, right: false };

  function reset() {
    blocks = []; score = 0; spawnTimer = 0; tick = 0;
    player.x = W / 2; running = true;
    overlay.hidden = true;
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    best = Math.max(best, Math.floor(score));
    msg.textContent = `スコア ${Math.floor(score)}　(ベスト ${best})`;
    document.getElementById('start').textContent = 'もう一度';
    overlay.hidden = false;
  }

  function spawn() {
    const w = 18 + Math.random() * 46;
    blocks.push({ x: Math.random() * (W - w), y: -24, w, h: 16,
                  v: 1.8 + Math.random() * 1.6 + tick / 2600 });
  }

  function loop() {
    if (!running) return;
    tick++;
    // 入力
    if (keys.left)  player.x -= player.speed;
    if (keys.right) player.x += player.speed;
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

    // ブロック生成（だんだん速く）
    if (--spawnTimer <= 0) { spawn(); spawnTimer = Math.max(14, 40 - tick / 90); }

    // 更新と当たり判定
    for (let i = blocks.length - 1; i >= 0; i--) {
      const b = blocks[i];
      b.y += b.v;
      if (b.y > H + 30) { blocks.splice(i, 1); score += 1; continue; }
      if (b.y + b.h > player.y - player.h / 2 && b.y < player.y + player.h / 2 &&
          b.x < player.x + player.w / 2 && b.x + b.w > player.x - player.w / 2) {
        return gameOver();
      }
    }
    score += 0.02;

    // 描画
    ctx.fillStyle = '#0a0d12'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1b2430';
    for (let y = (tick / 2) % 24 - 24; y < H; y += 24) ctx.fillRect(0, y, W, 1);

    ctx.fillStyle = '#f0a500';
    blocks.forEach((b) => ctx.fillRect(b.x, b.y, b.w, b.h));

    ctx.fillStyle = '#4f9cf9';
    ctx.fillRect(player.x - player.w / 2, player.y - player.h / 2, player.w, player.h);

    ctx.fillStyle = '#9aa7b5';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillText(`SCORE ${Math.floor(score)}`, 10, 22);

    requestAnimationFrame(loop);
  }

  // キーボード
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if ((e.key === ' ' || e.key === 'Enter') && !running) reset();
    if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  });
  addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });

  // タッチ（画面の左右半分で移動）
  function touch(e) {
    if (!e.touches.length) { keys.left = keys.right = false; return; }
    const x = e.touches[0].clientX;
    keys.left  = x < innerWidth / 2;
    keys.right = !keys.left;
  }
  addEventListener('touchstart', touch, { passive: true });
  addEventListener('touchmove', touch, { passive: true });
  addEventListener('touchend', () => { keys.left = keys.right = false; }, { passive: true });

  document.getElementById('start').addEventListener('click', reset);
})();
</script>
</body>
</html>
