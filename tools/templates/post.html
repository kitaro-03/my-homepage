<!DOCTYPE html>
<!-- このファイルは tools/build_blog.py が生成しています。直接編集しないでください。
     見た目を変えるときは tools/templates/post.html を編集してビルドし直します。 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — {{SITE_NAME}}</title>
<meta name="description" content="{{SUMMARY}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{SUMMARY}}">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ROOT}}assets/img/favicon.svg">
<link rel="stylesheet" href="{{ROOT}}assets/css/style.css">

<!-- ▼ AdSense を導入するときは index.html と同じタグをここにも入れる -->

<script>
  if (location.search.includes('ads=debug')) document.documentElement.classList.add('ads-debug');
</script>
</head>

<body>
<a class="skip-link" href="#main">本文へスキップ</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="{{ROOT}}">
      <span class="site-logo__mark" aria-hidden="true">K</span>
      <span>{{SITE_SHORT}}</span>
    </a>
    <nav class="site-nav" aria-label="サイト内">
      <a href="{{ROOT}}">ホーム</a>
      <a href="{{ROOT}}#works">制作物</a>
      <a href="{{ROOT}}blog/" aria-current="page">ブログ</a>
    </nav>
  </div>
</header>

<div class="shell">
  <aside class="rail" aria-hidden="true">
    <div class="rail__inner">
      <div class="ad-slot ad-slot--side" data-ad-slot="side-left" data-ad-label="広告 160x600"></div>
    </div>
  </aside>

  <main class="shell__main" id="main">
    <div class="ad-slot ad-slot--top" data-ad-slot="top" data-ad-label="広告 728x90"></div>

    <article class="article">
      <header class="article__head">
        <p class="article__meta">
          <a href="{{ROOT}}blog/">ブログ</a>
          <span aria-hidden="true">/</span>
          <time datetime="{{DATE_ISO}}">{{DATE_DISPLAY}}</time>
        </p>
        <h1 class="article__title">{{TITLE}}</h1>
        {{TAGS}}
      </header>

      <div class="article__body">
{{CONTENT}}
      </div>

      <nav class="article__nav" aria-label="前後の記事">{{POST_NAV}}</nav>
    </article>

    <p class="article__back">
      <a class="btn btn--sm btn--ghost" href="{{ROOT}}blog/">記事一覧へ戻る</a>
    </p>

    <div class="ad-slot ad-slot--bottom" data-ad-slot="bottom" data-ad-label="広告 728x90"></div>
  </main>

  <aside class="rail" aria-hidden="true">
    <div class="rail__inner">
      <div class="ad-slot ad-slot--side" data-ad-slot="side-right" data-ad-label="広告 160x600"></div>
    </div>
  </aside>
</div>

<footer class="site-footer">
  <nav aria-label="フッター">
    <a href="{{ROOT}}">ホーム</a>
    <a href="{{ROOT}}#works">制作物</a>
    <a href="{{ROOT}}blog/">ブログ</a>
    <a href="{{ROOT}}#env">制作環境</a>
  </nav>
  <p>&copy; {{YEAR}} {{AUTHOR}}</p>
</footer>
</body>
</html>
